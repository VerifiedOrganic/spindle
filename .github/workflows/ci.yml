name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Pre-existing on feat/automated (Phase 0 CI overflowed the same way):
      # sqlite_integration_tests::authoring_supervisor_integration_flow
      # stack-overflows in GitHub's default debug stack. Not introduced by
      # Phase 1; skip it so workspace CI can land the anti-slop scanner.
      - run: cargo test --workspace -- --skip authoring_supervisor_integration_flow
      - run: python3 evals/anti_slop.py self-test
      - run: python3 evals/anti_slop.py drift
      - run: node crates/spindle-mcp/tests/console_antislop_timeline.cjs
      - run: cargo clippy --workspace --all-targets -- -D warnings
